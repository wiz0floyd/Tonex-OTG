name: Build S20 hardware-probe APK

# ⚠️ DIAGNOSTIC-ONLY workflow (issue #25). Builds :app, which currently contains both the
# placeholder MainActivity (S10/S15) and the throwaway dev.tonexotg.app.probe harness — there is
# no separate probe module, so this is the same debug APK that would eventually contain real
# screens once S16-S19 land. For now it is exactly the probe harness plus a blank placeholder
# screen.
#
# This workflow exists only because the cloud dev-session environment that authored this harness
# has no Android SDK installed (see CLAUDE.md's environment notes) — GitHub's own runners do, so
# the APK is built here instead of locally.

on:
  workflow_dispatch:
  push:
    branches:
      - s20-hardware-probe-harness

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project's own toolchain requirement (see app/build.gradle.kts:
      # compileOptions.sourceCompatibility/targetCompatibility = VERSION_21, and
      # `kotlin { jvmToolchain(21) }`) is JDK 21, not 17 — settings.gradle.kts does not apply the
      # Foojay toolchain-resolver plugin, so an unmet toolchain would fail rather than
      # auto-download. GitHub's ubuntu-latest image ships JDK 21 pre-installed, so this installs
      # (and sets as default/JAVA_HOME) JDK 21 directly rather than 17, to actually satisfy that
      # requirement instead of relying on Gradle's cross-JDK auto-detection working out.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No explicit `sdkmanager` step: AGP 8.13.x auto-downloads a missing compileSdk 36
      # platform/build-tools at build time as long as SDK licenses are already accepted, which
      # GitHub's Android-ready ubuntu-latest image does by default. Add an explicit sdkmanager
      # step here only if this step's build log shows that auto-download failing.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tonex-otg-probe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
