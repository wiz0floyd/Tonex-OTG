name: Nightly

# Signed dev builds off every push to main, so `git pull && install` never needs an
# uninstall/reinstall between them (Android refuses to install a lower versionCode over an
# existing app with the same applicationId + signature, and a debug-keystore build isn't
# guaranteed to share a signature across machines/CI runs the way this does). Reuses the same
# RELEASE_KEYSTORE_* secrets release.yml uses (see #67) rather than a second keystore, so a
# nightly install can also upgrade in place to (or from) a real tagged release — one signature
# for both channels, by design.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A rapid string of pushes to main only needs the latest nightly built -- cancel any run this
# push supersedes rather than queueing every one.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to count commits

      # versionCode is the total commit count on main -- the same counter release.yml uses --
      # so nightly and tagged releases share one strictly-increasing number and either can
      # always install over the other. versionName is the last tagged release with a
      # "-nightly+<sha>" suffix, so it's obvious at a glance which release a nightly sits on
      # top of. See release.yml's own "Compute release version" step for the other half of
      # this scheme.
      - name: Compute nightly version
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          LAST_TAG="$(git tag -l 'v*' --sort=-version:refname --merged HEAD | head -1)"
          LAST_TAG="${LAST_TAG:-v0.0.0}"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=${LAST_TAG#v}-nightly+${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/_build-signed-apk.yml
    with:
      version-code: ${{ needs.version.outputs.code }}
      version-name: ${{ needs.version.outputs.name }}
    secrets: inherit

  publish:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk

      # A single moving "nightly" tag/release, updated in place on every push -- not one release
      # per commit. softprops/action-gh-release updates the existing release's assets/notes when
      # tag_name already exists rather than failing, so this never accumulates old nightly APKs.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ needs.version.outputs.name }})"
          body: |
            Automatic dev build off `main` @ ${{ github.sha }}. Not a tagged release — see
            [Releases](../../releases) for those. Signed with the same key and sharing the same
            versionCode counter as tagged releases, so installing this over a tagged release (or
            vice versa) never requires uninstalling first.
          files: '*.apk'
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
